name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r app/requirements-lock.txt
      - name: Test generated fixtures
        working-directory: app
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        working-directory: app
        run: python build_exe.py
      - name: Publish private release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFile = 'app/dist/NAS_Comic_Compressor_1.1.2.exe'
          Copy-Item -LiteralPath 'app/dist/NAS_Comic_Compressor.exe' -Destination $releaseFile
          $checksum = (Get-FileHash -LiteralPath $releaseFile -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'app/dist/SHA256SUMS.txt' -Value ($checksum + '  NAS_Comic_Compressor_1.1.2.exe') -Encoding utf8
          $releaseTag = 'v1.1.2-build.' + $env:GITHUB_RUN_NUMBER
          gh release create $releaseTag $releaseFile 'app/dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'NAS Comic Compressor 1.1.2' --notes 'Windows x64 ZIP compressor. Bandizip must be installed separately. Originals are preserved by default. NAS access retry fixes included.'
