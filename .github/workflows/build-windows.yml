name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q tests
          python tests/gui_smoke.py gui_smoke.png
          python tests/tray_smoke.py

      - name: Generate icon
        run: |
          python -m pip install pillow
          python tools/make_icon.py

      - name: Build single-file EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name NAS_Comic_Compressor --icon assets\icon.ico
          --exclude-module tkinter app.py

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\NAS_Comic_Compressor.exe -Algorithm SHA256).Hash
          "$h  NAS_Comic_Compressor.exe" | Out-File -Encoding ascii dist\SHA256.txt
          Get-Content dist\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NAS_Comic_Compressor
          path: |
            dist/NAS_Comic_Compressor.exe
            dist/SHA256.txt

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NAS_Comic_Compressor.exe
            dist/SHA256.txt
